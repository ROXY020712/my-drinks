<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174d3b"><title>My Drinks</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#25342d;font:15px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:22px 18px 100px}h1,h2,h3{color:#174d3b}h1{font: bold 38px Georgia;margin:5px 0}small{color:#747d74}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:24px;padding:10px 16px;background:#174d3b;color:white}button.alt{background:#e6ece4;color:#174d3b}input,select,textarea{width:100%;padding:11px;border:1px solid #d9ded5;border-radius:10px;background:white;margin:5px 0 12px}label{display:block}article,.panel{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #173c2510}.hero{background:#174d3b;color:#fff;padding:25px;border-radius:22px;margin:20px 0}.hero h2{color:white;font-family:Georgia}.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.chips{display:flex;gap:8px;overflow:auto;padding:8px 0}.chips button{white-space:nowrap}.pic{width:76px;height:76px;border-radius:14px;background:#e9eee7;display:grid;place-items:center;font-size:35px;object-fit:cover}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid article{margin:0}.gold{color:#b18b48}.big{font-size:25px;font-weight:bold;color:#174d3b}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd}nav button{background:none;color:#777;border-radius:0;padding:5px 8px;font-size:12px;flex:1;max-width:130px}nav button.active{color:#174d3b;font-weight:bold}nav span{display:block;font-size:23px}dialog{border:0;border-radius:20px;width:min(94%,500px);max-height:90vh;overflow:auto;padding:22px}dialog::backdrop{background:#0006}.bar{height:9px;background:#e6ece4;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#174d3b}hr{border:0;border-top:1px solid #eee} .muted{color:#777} .danger{color:#a33;background:#f8e9e6}img{max-width:100%}
</style><main><small>YOUR PERSONAL CAFÉ</small><h1>My Drinks.</h1><small>Make every sip count.</small><div id="view"></div></main><nav id="nav"></nav><dialog id="modal"></dialog><input id="importer" type="file" accept="application/json" hidden style="display:none"><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>crypto.randomUUID(), today=()=>new Date().toLocaleDateString('sv-SE'), money=n=>'¥'+Number(n).toFixed(2);const seed={Starbucks:['馥芮白','拿铁','美式','焦糖玛奇朵','抹茶拿铁'],Luckin:['生椰拿铁','丝绒拿铁','美式','拿铁','橙C美式'],Cotti:['生椰拿铁','美式','拿铁','澳白','卡布奇诺'],Manner:['澳白','拿铁','美式','燕麦拿铁','卡布奇诺'],CHAGEE:['伯牙绝弦','青青糯山','桂馥兰香','花田乌龙','万里木兰'],HEYTEA:['多肉葡萄','芝芝莓莓','纯绿茶','多肉桃李','烤黑糖波波牛乳'],Nayuki:['霸气橙子','霸气葡萄','茉莉初雪','鲜奶茶','纯茶'],CHABAIDAO:['豆乳玉麒麟','杨枝甘露','茉莉奶绿','乌龙奶茶','鲜果茶']};let data;try{data=JSON.parse(localStorage.getItem('my-drinks-v1'))}catch{}if(!data)data={menu:Object.entries(seed).flatMap(([b,ns])=>ns.map(n=>({id:uid(),b,n,p:0,img:''}))),orders:[]};let tab='Home',brand=data.menu[0]?.b||'',period='month';const save=()=>{try{localStorage.setItem('my-drinks-v1',JSON.stringify(data));return true}catch(e){alert('保存失败：存储空间可能不足，请导出备份。');return false}};save();const pic=d=>d.img&&/^data:image\/(png|jpeg|webp|gif);base64,/.test(d.img)?`<img class="pic" src="${esc(d.img)}">`:'<div class="pic">☕</div>';const stats=os=>({count:os.length,total:os.reduce((s,o)=>s+Number(o.p),0),unique:new Set(os.map(o=>o.b+'|'+o.n)).size});const group=(os,k)=>Object.entries(os.reduce((a,o)=>(a[o[k]]=(a[o[k]]||0)+1,a),Object.create(null))).sort((a,b)=>b[1]-a[1]);const byId=id=>data.menu.find(d=>d.id===id);function go(t){tab=t;render()}function card(d){return `<article class="row">${pic(d)}<div class="grow"><b>${esc(d.n)}</b><br><small>${esc(d.b)} · ${d.p?money(d.p):'价格待填写'}</small></div><button onclick="order('${d.id}')">＋</button><button class="alt" onclick="editDrink('${d.id}')">✎</button></article>`}function summary(os){let s=stats(os);return `<div class="grid">${[[s.count,'Cups'],[money(s.total),'Spent'],[s.unique,'New drinks'],[money(s.count?s.total/s.count:0),'Average']].map(([v,l])=>`<article><small>${l}</small><div class="big">${v}</div></article>`).join('')}</div>`}function render(){let v=$('#view');$('#nav').innerHTML=['Home','Menu','Orders','Insights','Passport','Me'].map((t,i)=>`<button class="${tab===t?'active':''}" onclick="go('${t}')"><span>${['⌂','☕','▤','◔','♧','⚙'][i]}</span>${t}</button>`).join('');let os=data.orders, month=os.filter(o=>o.date.startsWith(today().slice(0,7)));if(tab==='Home'){let fav=group(os,'drinkId').map(([id])=>byId(id)).filter(Boolean).slice(0,4);v.innerHTML=`<div class="hero"><small style="color:#d8e4da">YOUR DAILY MOMENT</small><h2>Life happens.<br>Coffee helps.</h2><button class="alt" onclick="go('Menu')">Record a drink →</button></div><h3>My usual</h3>${(fav.length?fav:data.menu.slice(0,3)).map(card).join('')}<h3>This month</h3>${summary(month)}`}if(tab==='Menu'){let bs=[...new Set(data.menu.map(d=>d.b))];if(!bs.includes(brand))brand=bs[0]||'';v.innerHTML=`<h2>Menu</h2><div class="chips">${bs.map((b,i)=>`<button class="${b===brand?'':'alt'}" onclick="chooseBrand(${i})">${esc(b)}</button>`).join('')}</div><div class="row"><h3 class="grow">${esc(brand)}</h3><button onclick="editDrink()">＋ Add drink</button></div>${data.menu.filter(d=>d.b===brand).map(card).join('')}`}if(tab==='Orders')v.innerHTML='<h2>My Orders</h2>'+ (os.length?[...os].sort((a,b)=>b.date.localeCompare(a.date)).map(o=>`<article><small>${esc(o.date)} · ${esc(o.b)}</small><h3>${esc(o.n)} <span style="float:right">${money(o.p)}</span></h3><small>${esc(o.size)} · ${esc(o.ice)} · ${esc(o.sugar)} · ${esc(o.extra)}</small><p class="gold">${'★'.repeat(o.rating)}${'☆'.repeat(5-o.rating)}</p><p>${esc(o.note)}</p><div class="chips"><button onclick="again('${o.id}')">Order again</button><button class="alt" onclick="editOrder('${o.id}')">Edit</button><button class="danger" onclick="delOrder('${o.id}')">Delete</button></div></article>`).join(''):'<p>No drinks yet.</p>');if(tab==='Insights'){let filtered=period==='month'?month:os.filter(o=>o.date.startsWith(today().slice(0,4)));v.innerHTML=`<h2>Insights</h2><div class="chips"><button onclick="period='month';render()">This month</button><button onclick="period='year';render()">This year</button></div>${summary(filtered)}${['b','n'].map((k,i)=>`<h3>${i?'Favourite drinks':'Favourite brands'}</h3>`+group(filtered,k).map(([n,c])=>`<article>${esc(n)} <b style="float:right">${c} cups</b><div class="bar"><i style="width:${c/filtered.length*100}%"></i></div></article>`).join('')).join('')}`}if(tab==='Passport'){let keys=[...new Set(os.map(o=>o.b+'|'+o.n))];v.innerHTML=`<h2>Drink Passport</h2><p>${keys.length} drinks unlocked</p><div class="grid">${keys.map((k,i)=>{let a=os.filter(o=>o.b+'|'+o.n===k),o=a[0],d=byId(o.drinkId)||o;return `<article style="background:#174d3b;color:white"><small style="color:#d7c49b">COLLECTION ${String(i+1).padStart(3,'0')}</small><p>${pic(d)}</p><b>${esc(o.n)}</b><p>${esc(o.b)}</p><p class="gold">★ ${(a.reduce((s,x)=>s+x.rating,0)/a.length).toFixed(1)}</p><small style="color:white">${a.length} cups · ${money(stats(a).total)}<br>First: ${a.map(x=>x.date).sort()[0]}</small></article>`}).join('')}</div>`}if(tab==='Me')v.innerHTML='<h2>Settings</h2><article><h3>My data</h3><p>Records stay in this browser. Export backups regularly.</p><button onclick="exportData()">Export backup</button> <button class="alt" onclick="$(\'#importer\').click()">Import backup</button></article><article><h3>About</h3>My Drinks V1.0 · Personal drink journal<br><small>No real orders or payments.</small></article>'}function chooseBrand(i){brand=[...new Set(data.menu.map(d=>d.b))][i];render()}function show(html){let m=$('#modal');m.innerHTML=html;if(!m.open)m.showModal()}function field(n,l,v='',type='text'){return `<label>${l}<input name="${n}" type="${type}" value="${esc(v)}" ${type==='number'?'min="0" step="0.01"':''} required></label>`}function sel(n,l,opts,v){return `<label>${l}<select name="${n}">${opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}function closeModal(){$('#modal').close()}function order(id){let d=byId(id);if(d)orderForm(d)}function again(id){let o=data.orders.find(x=>x.id===id);orderForm(byId(o.drinkId)||{id:o.drinkId,b:o.b,n:o.n,p:o.p},o,false)}function editOrder(id){let o=data.orders.find(x=>x.id===id);orderForm({id:o.drinkId,b:o.b,n:o.n,p:o.p},o,true)}function orderForm(d,o={},edit=false){show(`<h2>${esc(d.n)}</h2><small>${esc(d.b)}</small><form id="of">${field('date','饮用日期',edit?o.date:today(),'date')}${sel('size','杯型',['小杯','中杯','大杯','超大杯','其他'],o.size||'中杯')}${sel('ice','温度 / 冰量',['正常冰','少冰','去冰','热','常温'],o.ice||'少冰')}${sel('sugar','甜度',['标准糖','七分糖','五分糖','三分糖','无额外加糖','不适用'],o.sugar||'无额外加糖')}<label>小料 / 奶类<input name="extra" value="${esc(o.extra||'')}"></label>${field('p','实际支付 ¥',o.p??(d.p||''),'number')}${sel('rating','评分',['5','4','3','2','1'],String(o.rating||5))}<label>个人评价<textarea name="note">${esc(o.note||'')}</textarea></label><button type="submit">${edit?'Save changes':'Confirm order'}</button> <button type="button" class="alt" onclick="closeModal()">Cancel</button></form>`);$('#of').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),r={...f,id:edit?o.id:uid(),drinkId:d.id,b:d.b,n:d.n,p:Number(f.p),rating:Number(f.rating)};let old=data.orders;data.orders=edit?old.map(x=>x.id===o.id?r:x):[r,...old];if(!save()){data.orders=old;return}closeModal();go('Orders')}}function delOrder(id){if(confirm('删除这条记录？')){data.orders=data.orders.filter(o=>o.id!==id);save();render()}}function editDrink(id){let d=byId(id)||{b:brand,n:'',p:0,img:''};show(`<h2>${id?'Edit':'Add'} drink</h2><form id="df">${field('b','品牌',d.b)}${field('n','饮品名称',d.n)}${field('p','默认价格 ¥',d.p,'number')}<label>饮品图片<input name="photo" type="file" accept="image/*"></label><button>Save</button> <button type="button" class="alt" onclick="closeModal()">Cancel</button>${id?` <button type="button" class="danger" onclick="delDrink('${id}')">Delete</button>`:''}</form>`);$('#df').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),img=d.img;try{if(f.get('photo').size)img=await compress(f.get('photo'))}catch{alert('图片读取失败');return}let r={id:id||uid(),b:f.get('b').trim(),n:f.get('n').trim(),p:Number(f.get('p')),img};if(!r.b||!r.n)return;let old=data.menu;data.menu=id?old.map(x=>x.id===id?r:x):[...old,r];if(!save()){data.menu=old;return}brand=r.b;closeModal();render()}}function compress(file){return new Promise((res,rej)=>{let im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,480/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.7))};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}function delDrink(id){if(confirm('删除菜单饮品？历史订单仍保留。')){data.menu=data.menu.filter(d=>d.id!==id);save();closeModal();render()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='my-drinks-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('#importer').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.menu)||!Array.isArray(x.orders)||!x.menu.every(d=>typeof d.b==='string'&&typeof d.n==='string'&&Number.isFinite(d.p))||!x.orders.every(o=>typeof o.date==='string'&&typeof o.b==='string'&&typeof o.n==='string'&&Number.isFinite(o.p)&&Number.isInteger(o.rating)&&o.rating>=1&&o.rating<=5))throw Error();if(confirm('导入将覆盖当前记录，继续？')){x.menu=x.menu.map(d=>({...d,id:uid()}));x.orders=x.orders.map(o=>({...o,id:uid(),drinkId:x.menu.find(d=>d.b===o.b&&d.n===o.n)?.id||uid()}));let old=data;data=x;if(!save())data=old;render()}}catch{alert('无法读取备份文件')}e.target.value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
