ow">${pic(d)}<div class="grow"><b>${esc(dn(d))}</b><br><small>${esc(tr(d.b))} · ${d.p?money(d.p):tr("Price not set")}</small></div><button onclick="order('${d.id}')">＋</button><button class="alt" onclick="editDrink('${d.id}')">✎</button></article>`}function summary(os){let s=stats(os);return `<div class="grid">${[[s.count,'Cups'],[money(s.total),'Spent'],[s.unique,'Unique drinks'],[money(s.count?s.total/s.count:0),'Average']].map(([v,l])=>`<article><small>${l}</small><div class="big">${v}</div></article>`).join('')}</div>`}function render(){let v=$('#view');$('#nav').innerHTML=['Home','Menu','Orders','Insights','Passport','Me'].map((t,i)=>`<button class="${tab===t?'active':''}" onclick="go('${t}')"><span>${ico(i)}</span>${tr(t)}</button>`).join('');let os=data.orders, month=os.filter(o=>o.date.startsWith(today().slice(0,7)));if(tab==='Home'){let fav=group(os,'drinkId').map(([id])=>{let d=byId(id),o=[...os].filter(x=>x.drinkId===id).sort((a,b)=>b.date.localeCompare(a.date))[0];return d?{...d,p:o?.p??d.p}:null}).filter(Boolean).slice(0,4);v.innerHTML=`<div class="hero"><small style="color:#d8e4da">YOUR DAILY MOMENT</small><h2>Life happens.<br>Coffee helps.</h2><button class="alt" onclick="go('Menu')">Record a drink →</button></div><h3>My usual</h3>${(fav.length?fav:data.menu.slice(0,3)).map(card).join('')}<h3>This month</h3>${summary(month)}`}if(tab==='Menu'){let bs=brandList();if(!bs.includes(brand))brand=bs[0]||'';v.innerHTML=`<div class="row"><h2 class="grow">Menu</h2><button class="alt" onclick="manageBrands()">${lang==='zh'?'品牌管理':'Manage brands'}</button></div><div class="menuLayout"><div class="brands">${bs.map((b,i)=>`<button class="${b===brand?'':'alt'}" onclick="chooseBrand(${i})">${brandMark(b)}${esc(tr(b))}</button>`).join('')}</div><section><div class="row"><h3 class="grow">${esc(tr(brand))}</h3><button onclick="editDrink()">＋ ${tr("Add drink")}</button></div>${data.menu.filter(d=>d.b===brand).map(d=>card({...d,p:d.p||[...os].filter(o=>o.drinkId===d.id).sort((a,b)=>b.date.localeCompare(a.date))[0]?.p||0})).join('')}</section></div>`}if(tab==='Orders')v.innerHTML='<h2>My Orders</h2>'+ (os.length?[...os].sort((a,b)=>b.date.localeCompare(a.date)).map(o=>`<article class="ordercard"><small>${esc(o.date)} · ${esc(tr(o.b))}</small><div class="compact">${pic(byId(o.drinkId)||o)}<div class="grow"><h3>${esc(dn(o))}</h3><b>${money(o.p)}</b></div></div><small>${esc(opt(o.size))} · ${esc(opt(o.ice))} · ${esc(opt(o.sugar))} · ${esc(o.extra)}</small><p class="gold">${'★'.repeat(o.rating)}${'☆'.repeat(5-o.rating)}</p><p>${esc(o.note)}</p><div class="chips"><button onclick="again('${o.id}')">Order again</button><button class="alt" onclick="editOrder('${o.id}')">Edit</button><button class="danger" onclick="delOrder('${o.id}')">Delete</button></div></article>`).join(''):'<p>No drinks yet.</p>');if(tab==='Insights'){let filtered=os.filter(o=>o.date.startsWith(period==='month'?selectedMonth:selectedYear));v.innerHTML=`<h2>Insights</h2><div class="chips"><button class="${period==='month'?'':'alt'}" onclick="period='month';render()">This month</button><button class="${period==='year'?'':'alt'}" onclick="period='year';render()">This year</button></div>${period==='month'?`<input type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()">`:`<input type="number" min="1900" max="2100" value="${selectedYear}" onchange="selectedYear=this.value;render()">`}${summary(filtered)}${spending(filtered)}${['b','n'].map((k,i)=>`<h3>${i?'Favourite drinks':'Favourite brands'}</h3>`+group(filtered,k).map(([n,c])=>`<article>${esc(k==='b'?tr(n):dn({n}))} <b style="float:right">${c} ${tr(c===1?'cup':'cups')}</b><div class="bar"><i style="width:${c/filtered.length*100}%"></i></div></article>`).join('')).join('')}`}if(tab==='Passport'){let keys=[...new Set(os.map(o=>o.b+'|'+o.n))];data.collections=data.collections||{};for(let k of [...keys].reverse()){if(!data.collections[k])data.collections[k]=Math.max(0,...Object.values(data.collections))+1}save();keys.sort((a,b)=>data.collections[a]-data.collections[b]);v.innerHTML=`<h2>Drink Passport</h2><p>${keys.length} ${tr("drinks unlocked")}</p><div class="grid passport">${keys.map((k,i)=>{let a=os.filter(o=>o.b+'|'+o.n===k),o=a[0],d=byId(o.drinkId)||o;return `<article style="background:#174d3b;color:white"><small style="color:#d7c49b">${tr("COLLECTION")} ${String(data.collections[k]).padStart(3,'0')}</small><p>${pic(d)}</p><b>${esc(dn(o))}</b><p>${esc(tr(o.b))}</p><p class="gold">★ ${(a.reduce((s,x)=>s+x.rating,0)/a.length).toFixed(1)}</p><small style="color:white">${a.length} ${tr(a.length===1?'cup':'cups')} · ${money(stats(a).total)}<br>${tr("First:")} ${a.map(x=>x.date).sort()[0]}</small></article>`}).join('')}</div>`}if(tab==='Me')v.innerHTML='<h2>Settings</h2><article><h3>My data</h3><p>Records stay in this browser. Export backups regularly.</p><button onclick="exportData()">Export backup</button> <button class="alt" onclick="$(\'#importer\').click()">Import backup</button></article><article><h3>About</h3>My Drinks V1.3 · Personal drink journal<br><small>No real orders or payments.</small></article>';localize()}function brandMark(b){let marks={Starbucks:'S',Luckin:'L',Cotti:'C',Manner:'M',CHAGEE:'茶',HEYTEA:'喜',Nayuki:'奈',CHABAIDAO:'茶'};let im=data.brandImages?.[b];return `<span class="brandmark">${im&&/^data:image\/(png|jpeg|webp|gif);base64,/.test(im)?`<img src="${esc(im)}" alt="">`:esc(marks[b]||b.slice(0,2))}</span>`}function brandList(){return [...new Set([...(data.brands||[]),...data.menu.map(d=>d.b)])]}
function manageBrands(){show(`<h2>${lang==='zh'?'品牌管理':'Manage brands'}</h2><button onclick="brandForm()">＋ ${lang==='zh'?'添加品牌':'Add brand'}</button>${brandList().map((b,i)=>`<article class="row">${brandMark(b)}<b class="grow">${esc(tr(b))}</b><button class="alt" onclick="brandForm(${i})">${tr('Edit')}</button></article>`).join('')}<button class="alt" onclick="closeModal()">${tr('Cancel')}</button>`)}
function brandForm(i){let old=brandList()[i];show(`<h2>${lang==='zh'?(old?'编辑品牌':'添加品牌'):(old?'Edit brand':'Add brand')}</h2><form id="bf">${field('b',tr('Brand'),old||'')}<label>Logo<input type="file" name="logo" accept="image/*"></label><label><input style="width:auto" type="checkbox" name="reset">${lang==='zh'?'恢复默认标识':'Reset logo'}</label><button>${tr('Save')}</button> <button type="button" class="alt" onclick="manageBrands()">${tr('Cancel')}</button>${old?` <button type="button" class="danger" onclick="removeBrand(${i})">${tr('Delete')}</button>`:''}</form>`);$('#bf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),b=f.get('b').trim();if(!b||(!old||old!==b)&&brandList().includes(b)){alert(lang==='zh'?'品牌名称为空或重复':'Empty or duplicate brand');return}let before=JSON.stringify(data),im=data.brandImages?.[old];try{if(f.get('reset'))im='';if(f.get('logo')?.size)im=await compress(f.get('logo'))}catch{alert('Image error');return}data.brands=old?brandList().map(x=>x===old?b:x):[...brandList(),b];data.brandImages={...data.brandImages};if(old&&old!==b){delete data.brandImages[old];data.menu=data.menu.map(d=>d.b===old?{...d,b}:d);data.orders=data.orders.map(o=>o.b===old?{...o,b}:o);let c={...data.collections};for(let k of Object.keys(c))if(k.startsWith(old+'|')){let nk=b+k.slice(old.length);if(!c[nk])c[nk]=c[k];delete c[k]}data.collections=c}if(im)data.brandImages[b]=im;else delete data.brandImages[b];if(!save()){data=JSON.parse(before);return}brand=b;closeModal();render()}}
function removeBrand(i){let b=brandList()[i];if(!confirm(lang==='zh'?'删除品牌及菜单饮品？历史订单保留。':'Delete brand and menu drinks? Historical orders remain.'))return;let before=JSON.stringify(data);data.brands=brandList().filter(x=>x!==b);data.menu=data.menu.filter(d=>d.b!==b);if(!save()){data=JSON.parse(before);return}brand=brandList()[0]||'';closeModal();render()}
function chooseBrand(i){brand=brandList()[i];render()}function show(html){let m=$('#modal');m.innerHTML=html;if(!m.open)m.showModal()}function field(n,l,v='',type='text'){return `<label>${l}<input name="${n}" type="${type}" value="${esc(v)}" ${type==='number'?'min="0" step="0.01"':''} required></label>`}function sel(n,l,options,v){return `<label>${l}</label><div class="choices ${n==='rating'?'stars':''}">${options.map(x=>`<label class="${n==='rating'&&Number(x)<=Number(v)?'lit':''}"><input type="radio" name="${n}" value="${esc(x)}" ${x===v?'checked':''} required><span>${n==='rating'?'★':esc(opt(x))}</span></label>`).join('')}</div>`}function closeModal(){$('#modal').close()}function order(id){let d=byId(id);if(d)orderForm(d)}function again(id){let o=data.orders.find(x=>x.id===id);orderForm(byId(o.drinkId)||{id:o.drinkId,b:o.b,n:o.n,p:o.p},o,false)}function editOrder(id){let o=data.orders.find(x=>x.id===id);orderForm({id:o.drinkId,b:o.b,n:o.n,p:o.p},o,true)}function orderForm(d,o={},edit=false){show(`<h2>${esc(dn(d))}</h2><small>${esc(tr(d.b))}</small><form id="of">${field('date',tr('Drink date'),edit?o.date:today(),'date')}${sel('size',tr('Size'),['小杯','中杯','大杯','超大杯','其他'],o.size||'中杯')}${sel('ice',tr('Temperature / Ice'),['正常冰','少冰','去冰','热','常温'],o.ice||(/馥芮白|澳白|卡布奇诺/.test(d.n)?'热':'少冰'))}${sel('sugar',tr('Sweetness'),['标准糖','七分糖','五分糖','三分糖','无额外加糖','不适用'],o.sugar||'无额外加糖')}<label>${tr("Extras / Milk")}<input name="extra" value="${esc(o.extra||'')}"></label>${field('p',tr('Actual price ¥'),o.p??(d.p||''),'number')}${sel('rating',tr('Rating'),['1','2','3','4','5'],String(o.rating||''))}<label>${tr("Review")}<textarea name="note">${esc(o.note||'')}</textarea></label><div class="actions"><button type="submit">${tr(edit?'Save changes':'Confirm order')}</button> <button type="button" class="alt" onclick="closeModal()">${tr('Cancel')}</button></div></form>`);$('#of').addEventListener('change',e=>{if(e.target.name==='rating')$('#of').querySelectorAll('.stars label').forEach(l=>l.classList.toggle('lit',Number(l.querySelector('input').value)<=Number(e.target.value)))});$('#of').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),r={...f,id:edit?o.id:uid(),drinkId:d.id,b:d.b,n:d.n,en:d.en||names[d.n]||o.en||'',p:Number(f.p),rating:Number(f.rating)};let old=data.orders;data.orders=edit?old.map(x=>x.id===o.id?r:x):[r,...old];if(!save()){data.orders=old;return}closeModal();go('Orders')}}function delOrder(id){if(confirm(lang==='zh'?'删除这条记录？':'Delete this record?')){let old=data.orders;data.orders=data.orders.filter(o=>o.id!==id);if(!save())data.orders=old;render()}}function editDrink(id){let d=byId(id)||{b:brand,n:'',p:0,img:''};show(`<h2>${tr(id?'Edit drink':'Add drink')}</h2><form id="df">${field('b',tr('Brand'),d.b)}${field('n',tr('Drink name'),d.n)}<label>${tr('English name')}<input name="en" value="${esc(d.en||names[d.n]||'')}"></label>${field('p',tr('Default price ¥'),d.p,'number')}<label>${tr("Drink photo")}<input name="photo" type="file" accept="image/*"></label><label><input style="width:auto" type="checkbox" name="resetphoto"> ${lang==='zh'?'恢复默认图片':'Reset photo'}</label><label>${lang==='zh'?'品牌图片':'Brand image'}<input name="brandphoto" type="file" accept="image/*"></label><button>${tr("Save")}</button> <button type="button" class="alt" onclick="closeModal()">${tr("Cancel")}</button>${id?` <button type="button" class="danger" onclick="delDrink('${id}')">${tr("Delete")}</button>`:''}</form>`);$('#df').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),img=f.get('resetphoto')?'':d.img;try{if(f.get('photo').size)img=await compress(f.get('photo'))}catch{alert('图片读取失败');return}let r={id:id||uid(),b:f.get('b').trim(),n:f.get('n').trim(),en:f.get('en').trim(),p:Number(f.get('p')),img};if(!r.b||!r.n)return;let old=data.menu,oldImages=data.brandImages;try{if(f.get('brandphoto')?.size)data.brandImages={...data.brandImages,[r.b]:await compress(f.get('brandphoto'))}}catch{alert(lang==='zh'?'品牌图片读取失败':'Unable to read brand image');return}data.menu=id?old.map(x=>x.id===id?r:x):[...old,r];if(!save()){data.menu=old;data.brandImages=oldImages;return}brand=r.b;closeModal();render()}}function compress(file){return new Promise((res,rej)=>{let im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,480/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.7))};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}function delDrink(id){if(confirm(lang==='zh'?'删除菜单饮品？历史订单仍保留。':'Delete menu drink? Historical orders remain.')){data.menu=data.menu.filter(d=>d.id!==id);save();closeModal();render()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='my-drinks-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('#importer').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.menu)||!Array.isArray(x.orders)||!x.menu.every(d=>typeof d.b==='string'&&typeof d.n==='string'&&Number.isFinite(d.p))||!x.orders.every(o=>typeof o.date==='string'&&typeof o.b==='string'&&typeof o.n==='string'&&Number.isFinite(o.p)&&Number.isInteger(o.rating)&&o.rating>=1&&o.rating<=5))throw Error();if(confirm('导入将覆盖当前记录，继续？')){x.menu=x.menu.map(d=>({...d,id:uid()}));x.orders=x.orders.map(o=>({...o,id:uid(),drinkId:x.menu.find(d=>d.b===o.b&&d.n===o.n)?.id||uid()}));let old=data;data=x;if(!save())data=old;render()}}catch{alert('无法读取备份文件')}e.target.value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=130').catch(()=>{});
</script></html>
